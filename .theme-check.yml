extends: theme-check:all
ignore:
  - node_modules/**

# The motion layer deliberately self-hosts GSAP + ScrollTrigger + Lenis in
# assets/ (no runtime CDN, per project requirement). GSAP (~71KB) exceeds the
# default 10KB compressed JS guideline, so the threshold is raised to
# accommodate the vendored library. (Motion.js was dropped — GSAP now covers
# accordion + add-to-cart too.) Revisit if the JS budget becomes a concern.
AssetSizeJavaScript:
  threshold_in_bytes: 100000

# The theme's stylesheet is one file cut in two at a single point and linked
# back to back in both layouts (theme.liquid, password.liquid): base.css holds
# everything above the "Inner pages (pre-redesign)" block, base-pages.css that
# block and everything after it. Link order = the old file order, so the
# cascade is unchanged: keep base.css first and never move a rule across the
# cut. The reasoning stays in comments beside the rules it explains; Shopify
# serves both files minified (comments and whitespace stripped), so what
# reaches a shopper is well under half the raw size. The check measures each
# file on disk on its own (CRLF in a Windows checkout); the threshold stays at
# 130000 and each file must stay under it. New CSS goes into the
# {% stylesheet %} of the section, block or snippet that owns it, not into
# these two files.
AssetSizeCSS:
  threshold_in_bytes: 130000

# Every section now carries per-element typography, padding and colour
# groups (scripts/schema generates them; visible_if keeps the panels short),
# so the default 40-setting ceiling would warn on almost every file. The
# generator reads the same number and warns at the same threshold.
ExcessiveSettingsCount:
  maxSettings: 120
