extends: theme-check:all
ignore:
  - node_modules/**

# The motion layer deliberately self-hosts GSAP + ScrollTrigger + Lenis in
# assets/ (no runtime CDN, per project requirement). GSAP (~71KB) exceeds the
# default 10KB compressed JS guideline, so the threshold is raised to
# accommodate the vendored library. (Motion.js was dropped — GSAP now covers
# accordion + add-to-cart too.) Revisit if the JS budget becomes a concern.
AssetSizeJavaScript:
  threshold_in_bytes: 100000

# base.css is one stylesheet for the whole theme, with the reasoning kept in
# comments beside the rules it explains. Shopify serves it minified — comments
# and whitespace stripped — so what reaches a shopper is well under half the
# raw file. The threshold is raised to keep the check meaningful against the
# delivered size rather than the source. See the measurement in the QA notes.
AssetSizeCSS:
  threshold_in_bytes: 130000
